<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game Details</title>
<link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header class="game-hero" id="gameHero">

  <div class="hero-overlay"></div>

  <div class="hero-content">
    <h1 id="gameTitle"></h1>
    <p id="gamePlatform"></p>
  </div>

</header>

<section class="info-carousel">

  <div class="info-track">

    <div class="info-card">
      <h2>Cover</h2>
      <img id="coverImage">
    </div>

    <div class="info-card">
      <h2>Trailer</h2>
      <iframe id="gameTrailer" frameborder="0" allowfullscreen></iframe>
    </div>

    <div class="info-card">
      <h2>Description</h2>
      <p id="gameInsight"></p>
    </div>

    <div class="info-card">
      <h2>Genres</h2>
      <div id="gameTags"></div>
    </div>

    <div class="info-card">
      <h2>Screenshots</h2>
      <div id="gameScreenshots" class="screenshot-gallery"></div>
    </div>

    <div class="info-card">
      <h2>Review</h2>
      <p id="gameReview"></p>
    </div>

  </div>

</section>

<section class="game-detail">

<p id="gameInsight"></p>

<div id="gameTags"></div>

<a href="index.html" class="back-button">← Back to Game Library</a>

</section>

<script src="js/game.js"></script>

<div id="lightbox" class="lightbox hidden">
  <img id="lightboxImage">
</div>

</body>
</html>
