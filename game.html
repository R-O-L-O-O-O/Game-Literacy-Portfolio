<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game Details</title>
<link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header class="game-hero" id="gameHero">

  <div class="hero-overlay"></div>

  <div class="hero-content">
    <h1 id="gameTitle"></h1>
    <p id="gamePlatform"></p>
    <div id="heroGenres" class="hero-genres"></div>
  </div>

</header>

<section class="info-carousel">

  <div class="info-track">

    <div class="info-card">
      <h2>Cover</h2>
      <img id="coverImage">
    </div>

    <div class="info-card description-card">
      <h2>Description</h2>

      <div class="description-content">

        <div class="description-text">
          <p id="gameDescription"></p>
        </div>

        <div class="description-meta">

          <div class="meta-group">
            <h3>Genres</h3>
            <div id="gameGenres" class="genre-list"></div>
          </div>

          <div class="meta-group">
            <h3>Platform</h3>
            <p id="gamePlatformMeta"></p>
          </div>

        </div>

      </div>

    </div>

    <div class="info-card">
      <h2>Trailer</h2>
      <iframe id="gameTrailer" frameborder="0" allowfullscreen></iframe>
    </div>

    <div class="info-card screenshots-card">
      <h2>Screenshots</h2>
      <div id="gameScreenshots" class="screenshot-gallery"></div>
    </div>

    <div class="info-card">
      <h2>Review</h2>
      <p id="gameReview"></p>
    </div>

  </div>

</section>

<script src="js/game.js"></script>

<div id="lightbox" class="lightbox hidden">

  <button id="prevBtn" class="lightbox-btn">❮</button>

  <img id="lightboxImage">

  <button id="nextBtn" class="lightbox-btn">❯</button>

</div>

</body>
</html>
